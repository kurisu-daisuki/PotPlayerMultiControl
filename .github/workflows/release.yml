name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve version from tag
        id: meta
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Tag '$tag' must match vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease"
          }
          $version = $tag.Substring(1)
          $prerelease = $tag.Contains("-").ToString().ToLowerInvariant()
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
          "zip_fd=PotPlayerMultiControl-$tag-win-x64.zip" >> $env:GITHUB_OUTPUT
          "zip_sc=PotPlayerMultiControl-$tag-win-x64-self-contained.zip" >> $env:GITHUB_OUTPUT

      - name: Publish framework-dependent
        run: >
          dotnet publish
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -p:Version=${{ steps.meta.outputs.version }}
          -o publish/fd

      - name: Publish self-contained
        run: >
          dotnet publish
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -p:Version=${{ steps.meta.outputs.version }}
          -o publish/sc

      - name: Pack zips
        shell: pwsh
        run: |
          function Pack-Exe([string]$dir, [string]$zip) {
            $exe = Get-ChildItem -Path $dir -Filter *.exe | Select-Object -First 1
            if (-not $exe) { throw "No exe found in $dir" }
            Compress-Archive -Path $exe.FullName -DestinationPath $zip -Force
          }
          Pack-Exe publish/fd ${{ steps.meta.outputs.zip_fd }}
          Pack-Exe publish/sc ${{ steps.meta.outputs.zip_sc }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.meta.outputs.zip_fd }}
            ${{ steps.meta.outputs.zip_sc }}
          generate_release_notes: true
          append_body: true
          body: |
            Two Windows x64 builds:

            - `*-win-x64.zip` — framework-dependent (~0.1 MB). Requires the [.NET 8 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/8.0) (not ASP.NET / the regular Runtime).
            - `*-win-x64-self-contained.zip` — self-contained (~60 MB). No extra runtime install; just unzip and run.
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
